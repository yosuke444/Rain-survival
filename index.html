<body>
<canvas id="game"></canvas>

<!-- スマホ用ボタン -->
<div id="touch" class="hidden">
  <div class="pad left">
    <button data-key="left" class="b1">◀</button>
    <button data-key="down" class="b2">▼</button>
    <button data-key="right" class="b3">▶</button>
  </div>
  <div class="pad right">
    <button data-key="menu" class="b4 small">X<span>もちもの</span></button>
    <button data-key="up" class="b5">▲<span>ジャンプ</span></button>
    <button data-key="use" class="b6">Z<span>つかう</span></button>
  </div>
</div>

<div id="loading">よみこみ中…</div>
